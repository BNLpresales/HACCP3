    <style>
        body {

		<button id="printButton" onclick="sendToPrint()">Print label</button>

        function sendToPrint() {
            const url = generateUrlScheme();
            window.open(url, '_blank');
            resetInputs();
        }

        function previewLink() {
            const url = generateUrlScheme();
            document.getElementById('urlSchemeText').textContent = url;
            document.getElementById('urlScheme').style.display = 'block';
        }

		function generateUrlScheme() {
            const creatorName = document.getElementById('creatorName').value;
            const productName = document.getElementById('productName').value;
            const allergens = Array.from(document.querySelectorAll('input[name="allergens"]:checked')).map(el => el.value).join("\r\n"); //used allergens be filled in on new line each
			const text1 = document.getElementById("text1Object").value;
            const text2 = document.getElementById("text2Object").value;
			const copies = document.getElementById('copies').value;
			return `brotherwebprint://print?filename=HACCP45x72mm.lbx&size=HACCP45x72mm.bin&text_text1=${encodeURIComponent(text1)}&text_text2=${encodeURIComponent(text2)}&text_creatorName=${encodeURIComponent(creatorName)}&text_productName=${encodeURIComponent(productName)}&text_allergens=${encodeURIComponent(allergens)}&copies=${copies}`;
        }

        function resetInputs() {
            document.getElementById('creatorName').value = '';
            document.getElementById('productName').value = '';
			document.getElementById('text1').value = '';
			document.getElementById('text2').value = '';
            document.querySelectorAll('input[name="allergens"]').forEach(checkbox => checkbox.checked = false);
            document.getElementById('summary').innerHTML = '';
            //document.getElementById('printButton').style.display = 'none';
            document.getElementById('previewButton').style.display = 'none';
            document.getElementById('copies').value = 1;
			document.getElementById('urlScheme').style.display = 'none';
        }

        // Limit the selection of allergens to a maximum of 6
        document.querySelectorAll('input[name="allergens"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const checkedToppings = document.querySelectorAll('input[name="allergens"]:checked');
                if (checkedToppings.length > 6) {
                    this.checked = false;
                    alert("You can use maximum 6 allergens.");
                }
            });
        });
