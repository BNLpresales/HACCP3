<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Productos y Etiquetas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: auto;
            margin: 0;
        }

        .container {
            text-align: center;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
        }

        h1, h2, label {
            color: #333;
        }

        button {
            font-size: 18px;
            padding: 15px;
            margin: 10px 0;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .hidden {
            display: none;
        }

        input, select {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        select {
            background-color: #4CAF50; /* Green background */
            color: white;              /* White text */
            border: none;              /* Remove default border */
        }

        select:hover {
            background-color: #45a049; /* Darker green when hovered */
        }

        #generatedURL {
            text-align: center;
            word-wrap: break-word;
            margin: 10px auto;
            max-width: 100%;
        }

        #printStatus {
            margin-top: 20px;
            font-size: 18px;
            color: #4CAF50;
        }
        
        /* New CSS for MAIN MENU button */
        button.mainMenu {
            background-color: #b0b0b0; /* Gray color */
        }

        button.mainMenu:hover {
            background-color: #6e6e6e; /* Slightly darker gray when hovered */
        }

        /* Light Green Background for specific fields */
        #Lote, #daysToAdd, #copies {
            background-color: #d4edda; /* Light Green */
            border: 1px solid #c3e6cb; /* Light green border for consistency */
        }

        #Lote:focus, #daysToAdd:focus, #copies:focus {
            background-color: #c3e6cb; /* Slightly darker green when focused */
            border-color: #155724; /* Darker green border when focused */
        }

        /* Rotate the page when printing */
        @media print {
            /* Rotate the body by 180 degrees */
            body {
                transform: rotate(180deg);
                transform-origin: center;
                -webkit-transform: rotate(180deg);
                -webkit-transform-origin: center;
            }

            /* Optional: Adjust content to fit after rotation */
            .container {
                transform: rotate(180deg);
                transform-origin: center;
                -webkit-transform: rotate(180deg);
                -webkit-transform-origin: center;
            }

            /* Hide the buttons during print */
            button {
                display: none;
            }

            #generatedURL, #printStatus {
                display: none;
            }
        }
    </style>
</head>
<body>

<div id="foodSelection" class="container">
    <h1>Selector de Productos</h1>
    <label for="foodDropdown">Seleccionar Producto:</label>
    <select id="foodDropdown" onchange="selectFood(this.value)">
        <option value="-Select-">-Seleccionar el Producto-</option>
        <option value="Pasta">Pasta</option>
        <option value="Pan">Pan</option>
        <option value="Leche">Leche</option>
        <option value="Jamon">Jamon</option>
        <option value="Queso">Queso</option>
        <option value="Pollo">Pollo</option>
        <option value="Carne">Carne</option>
        <option value="Pescado">Pescado</option>
        <option value="Manzana">Manzana</option>
        <option value="Plátano">Plátano</option>
        <option value="Naranja">Naranja</option>
        <option value="Zanahoria">Zanahoria</option>
    </select>
    <h1></h1>
    <label>Plantilla de Etiqueta:<input type="text" id="labelTemplate" value="ETIQPRECO.lbx"></label>
    <label>Tamaño de Etiqueta:<input type="text" id="labelSize" value="60x40mm.bin"></label>
</div>

<div id="labelPage" class="container hidden">
    <h2>Etiqueta HACCP</h2>
    <label>Nombre del Producto:<input type="text" id="productName" readonly></label>
    <label>Fecha de Producción:<input type="text" id="productionDate"></label> <!-- Changed to type text -->
    <label>Lote:<input type="text" id="Lote" oninput="toUpperCaseLote()"></label>
    <label>Días para la Fecha de Caducidad:<input type="number" id="daysToAdd" min="1" oninput="calculateExpiration()"></label>

    <label>Fecha de Caducidad:<input type="text" id="BestBeforeDate" readonly></label> <!-- Changed to type text -->
    
    <label>Preparado por:
        <select id="PrepPor">
            <option value="- Seleccionar Usuario -">- Seleccionar Usuario -</option>
            <option value="Alvaro">Alvaro</option>
            <option value="João">João</option>
            <option value="Carlos">Carlos</option>
            <option value="Hector">Hector</option>
            <option value="Victor">Victor</option>
        </select>
    </label>

    <label>Número de Copias:<input type="number" id="copies" min="1"></label>
    <button onclick="generateAndPrint()">Imprimir</button>
    <p id="generatedURL"></p>
    <p id="printStatus"></p>
    <button class="mainMenu" onclick="refreshPage()">MENÚ PRINCIPAL</button> <!-- Added class to button -->
</div>

<script>
    // Function to format date as DD:MM:YYYY
    function formatDateToDDMMYYYY(date) {
        const day = date.getDate().toString().padStart(2, '0');
        const month = (date.getMonth() + 1).toString().padStart(2, '0');
        const year = date.getFullYear();
        return `${day}/${month}/${year}`;
    }

    function selectFood(foodName) {
        if (foodName === "") return;
        document.getElementById('foodSelection').classList.add('hidden');
        document.getElementById('labelPage').classList.remove('hidden');
        document.getElementById('productName').value = foodName;

        const today = new Date();
        document.getElementById('productionDate').value = formatDateToDDMMYYYY(today); // Display in DD/MM/YYYY
    }

    function calculateExpiration() {
        const daysToAdd = parseInt(document.getElementById('daysToAdd').value);
        if (isNaN(daysToAdd) || daysToAdd <= 0) {
            document.getElementById('BestBeforeDate').value = ''; // Clear the Best Before Date if the input is invalid
            document.getElementById('printStatus').textContent = 'Por favor ingrese un número válido de días.';
            document.getElementById('printStatus').style.color = 'red';
            return;
        }
        const today = new Date();
        today.setDate(today.getDate() + daysToAdd);
        document.getElementById('BestBeforeDate').value = formatDateToDDMMYYYY(today); // Display in DD:MM:YYYY
    }

    function toUpperCaseLote() {
        const loteInput = document.getElementById('Lote');
        loteInput.value = loteInput.value.toUpperCase();
    }

    function generateAndPrint() {
        // Change button text to "A imprimir..."
        const printButton = document.querySelector("button");
        printButton.textContent = "A imprimir..."; 

        const template = encodeURIComponent(document.getElementById('labelTemplate').value);
        const size = encodeURIComponent(document.getElementById('labelSize').value);
        const product = encodeURIComponent(document.getElementById('productName').value);
        const prodDate = encodeURIComponent(document.getElementById('productionDate').value);
        const Lote = encodeURIComponent(document.getElementById('Lote').value);
        const expDate = encodeURIComponent(document.getElementById('BestBeforeDate').value);
        const PrepPor = encodeURIComponent(document.getElementById('PrepPor').value);
        const copies = encodeURIComponent(document.getElementById('copies').value);

        // Validate that 'Preparado por' is filled
        if (!PrepPor) {
            document.getElementById('printStatus').textContent = 'Por favor ingrese el campo "Preparado por".';
            document.getElementById('printStatus').style.color = 'red';
            printButton.textContent = "Imprimir"; // Reset the button text in case of error
            return;
        }

        const url = `brotherwebprint://print?filename=ETIOPRECO.lbx&size=60x40mm.bin&copies=${copies}&text_NomeProduto=${product}&text_DataProd=${prodDate}&text_Lote=${Lote}&text_DataVal=${expDate}&text_PrepPor=${PrepPor}`;

        document.getElementById('generatedURL').textContent = url;

             .catch(error => {
                document.getElementById('printStatus').textContent = 'Error en la impresión: ' + error;
                document.getElementById('printStatus').style.color = 'red';
                deletePrintQueue();
                printButton.textContent = "Imprimir"; // Reset the button text in case of error
            });
    }

    function deletePrintQueue() {
        fetch('http://localhost:8088/deleteQueue', { method: 'POST' })
            .then(response => response.text())
            .then(result => {
                console.log('Cola de impresión vaciada:', result);
            })
            .catch(error => {
                console.log('Error al vaciar la cola de impresión:', error);
            });
    }

    function refreshPage() {
        location.reload();
    }
</script>

</body>
</html>
